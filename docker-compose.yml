# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wizz
    ports:
      - '5432:5432'
    volumes:
      - wizz-db:/var/lib/postgresql/data
volumes:
  wizz-db:
